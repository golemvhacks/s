name: Dashwave CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code.
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up the desired Python version.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. Install pip (usually preinstalled) and dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telebot flask aiogram pyTelegramBotAPI python-telegram-bot pytz psutil motor
          # Install any additional dependencies here

      # 4. (Optional) Run your tests to validate changes.
      - name: Run tests
        run: |
          # Replace with your testing framework command (e.g., pytest)
          pytest --maxfail=1 --disable-warnings -q

      # 5. Deploy or run your bot script.
      # Note: In a CI environment, long-running processes need special handling.
      # If your Dashwave.io setup expects a persistent process, you might use a deployment CLI
      # or push the build to a server. Here, we simulate running the script.
      - name: Start the bot script
        run: |
          # Run the bot script in the background (simulate using screen-like behavior)
          nohup python3 golemss.py > bot.log 2>&1 &
          # Give it a few seconds to initialize
          sleep
